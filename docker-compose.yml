services:
  wiki:
    image: node:18-alpine
    working_dir: /wiki
    volumes:
      - .:/wiki
    # Install build tools for native modules (sqlite3 needs build tools)
    command: sh -c "apk add --no-cache git python3 make g++ && if [ ! -d node_modules ]; then npm install --legacy-peer-deps; fi && npm rebuild sqlite3 && npm run dev"
    ports:
      - '3010:3010'
    restart: unless-stopped
    environment:
      NODE_ENV: development
