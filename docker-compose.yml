services:
  wiki:
    image: node:18-alpine
    working_dir: /wiki
    volumes:
      - .:/wiki:ro
      - ../longevience-wiki/data:/wiki/data
      - ../longevience-wiki/assets:/wiki/assets
      - ../longevience-wiki/.webpack-cache:/wiki/.webpack-cache
    # Install build tools for native modules (sqlite3 needs build tools)
    command: sh -c "apk add --no-cache git openssh-client python3 make g++ && npm run dev"
    ports:
      - '3010:3010'
    restart: unless-stopped
    environment:
      NODE_ENV: development
