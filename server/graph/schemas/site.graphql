# ===============================================
# SITE
# ===============================================

extend type Query {
  site: SiteQuery
}

extend type Mutation {
  site: SiteMutation
}

# -----------------------------------------------
# QUERIES
# -----------------------------------------------

type SiteQuery {
  config: SiteConfig @auth(requires: ["manage:system"])
}

# -----------------------------------------------
# MUTATIONS
# -----------------------------------------------

type SiteMutation {
  updateConfig(
    host: String
    title: String
    description: String
    robots: [String]
    analyticsService: String
    analyticsId: String
    company: String
    contentLicense: String
    footerOverride: String
    logoUrl: String
    rootOgImageUrl: String
    pageExtensions: String
    authAutoLogin: Boolean
    authEnforce2FA: Boolean
    authHideLocal: Boolean
    authLoginBgUrl: String
    authJwtAudience: String
    authJwtExpiration: String
    authJwtRenewablePeriod: String
    editFab: Boolean
    editMenuBar: Boolean
    editMenuBtn: Boolean
    editMenuExternalBtn: Boolean
    editMenuExternalName: String
    editMenuExternalIcon: String
    editMenuExternalUrl: String
    featurePageRatings: Boolean
    featurePageComments: Boolean
    featurePersonalWikis: Boolean
    securityOpenRedirect: Boolean
    securityIframe: Boolean
    securityReferrerPolicy: Boolean
    securityTrustProxy: Boolean
    securitySRI: Boolean
    securityHSTS: Boolean
    securityHSTSDuration: Int
    securityCSP: Boolean
    securityCSPDirectives: String
    anonViewLimitEnabled: Boolean
    anonViewLimitCount: Int
    anonViewLimitResetHours: Int
    anonViewLimitExemptPaths: [String]
    anonViewLimitExemptTags: [String]
    anonViewLimitExemptBots: Boolean
    anonViewLimitTruncatePercent: Int
    anonViewLimitHashSecret: String
    anonViewLimitWarnThreshold: Int
    anonViewLimitNoIndexOnLimit: Boolean
    conversionCtaEnabled: Boolean
    conversionCtaVariants: [String]
    conversionCtaFrequencyHours: Int
    conversionCtaSoftPromptPages: Int
    externalUserPortalEnabled: Boolean
    externalUserPortalBaseUrl: String
    externalUserPortalApiKey: String
    externalUserPortalTimeoutMs: Int
    uploadMaxFileSize: Int
    uploadMaxFiles: Int
    uploadScanSVG: Boolean
    uploadForceDownload: Boolean

  ): DefaultResponse @auth(requires: ["manage:system"])
}

# -----------------------------------------------
# TYPES
# -----------------------------------------------

type SiteConfig {
  host: String
  title: String
  description: String
  robots: [String]
  analyticsService: String
  analyticsId: String
  company: String
  contentLicense: String
  footerOverride: String
  logoUrl: String
  rootOgImageUrl: String
  pageExtensions: String
  authAutoLogin: Boolean
  authEnforce2FA: Boolean
  authHideLocal: Boolean
  authLoginBgUrl: String
  authJwtAudience: String
  authJwtExpiration: String
  authJwtRenewablePeriod: String
  editFab: Boolean
  editMenuBar: Boolean
  editMenuBtn: Boolean
  editMenuExternalBtn: Boolean
  editMenuExternalName: String
  editMenuExternalIcon: String
  editMenuExternalUrl: String
  featurePageRatings: Boolean
  featurePageComments: Boolean
  featurePersonalWikis: Boolean
  securityOpenRedirect: Boolean
  securityIframe: Boolean
  securityReferrerPolicy: Boolean
  securityTrustProxy: Boolean
  securitySRI: Boolean
  securityHSTS: Boolean
  securityHSTSDuration: Int
  securityCSP: Boolean
  securityCSPDirectives: String
  anonViewLimitEnabled: Boolean
  anonViewLimitCount: Int
  anonViewLimitResetHours: Int
  anonViewLimitExemptPaths: [String]
  anonViewLimitExemptTags: [String]
  anonViewLimitExemptBots: Boolean
  anonViewLimitTruncatePercent: Int
  anonViewLimitHashSecret: String
  anonViewLimitWarnThreshold: Int
  anonViewLimitNoIndexOnLimit: Boolean
  conversionCtaEnabled: Boolean
  conversionCtaVariants: [String]
  conversionCtaFrequencyHours: Int
  conversionCtaSoftPromptPages: Int
  externalUserPortalEnabled: Boolean
  externalUserPortalBaseUrl: String
  externalUserPortalApiKey: String
  externalUserPortalTimeoutMs: Int
  uploadMaxFileSize: Int
  uploadMaxFiles: Int
  uploadScanSVG: Boolean
  uploadForceDownload: Boolean
}
